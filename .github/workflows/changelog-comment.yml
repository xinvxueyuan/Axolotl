name: Changelog Comment

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to post the changelog comment on (for testing)'
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  comment:
    name: Post changelog comment
    runs-on: ubuntu-latest
    # Fork PRs get a GITHUB_TOKEN that cannot write issue comments on the base
    # repository ("Resource not accessible by integration"). Skip the job there
    # instead of failing a check the contributor cannot fix.
    # workflow_dispatch is always allowed so a maintainer can target a fork PR
    # by number; posting may still soft-skip if the token is forbidden.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Post or update changelog comment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- changelog -->';
            const mergedMarker = '<!-- changelog-merged -->';

            const sections = ['### Added', '', '### Changed', '', '### Deprecated', '', '### Removed', '', '### Fixed', '', '### Security'].join('\n');
            const productBlock = (name) => `<details>\n<summary>${name}</summary>\n\n${sections}\n\n</details>`;

            const template = [
              marker,
              '## Pull request changelog',
              '',
              '<!-- Fill in the changelog under each product area this PR affects.',
              '     Empty sections are ignored. Leave a product collapsed/empty',
              '     if it doesn\'t apply. -->',
              '',
              productBlock('App'),
              '',
              productBlock('Website'),
            ].join('\n');

            // Resolve PR number from event or workflow_dispatch input (via env,
            // never interpolated into the script source).
            const prNumber = context.payload.pull_request?.number
              ?? Number.parseInt(process.env.PR_NUMBER ?? '', 10);

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('Could not determine PR number');
              return;
            }

            const isForbidden = (error) => error.status === 403 || error.status === 401;
            // Secondary rate limits are also 403; never treat those as "skip".
            const isRateLimit = (error) =>
              error.status === 403 && /rate limit/i.test(String(error.message ?? ''));

            // Get PR details (need head repo + base ref for child PR detection)
            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }));
            } catch (error) {
              if (isRateLimit(error)) {
                core.setFailed(`GitHub rate limit while reading PR #${prNumber}: ${error.message}`);
                return;
              }
              if (isForbidden(error)) {
                core.notice(`Skipping changelog comment on PR #${prNumber}: token cannot read the pull request (${error.status}).`);
                return;
              }
              throw error;
            }

            const headRepo = pr.head.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const isForkPr = Boolean(headRepo) && headRepo !== baseRepo;

            // Soft-succeed only for fork PRs when the token is forbidden.
            // A same-repo 403 means the workflow lost issues:write — fail hard.
            const softSkipForbidden = (error, action) => {
              if (isRateLimit(error)) {
                core.setFailed(`GitHub rate limit while ${action} on PR #${prNumber}: ${error.message}`);
                return true;
              }
              if (isForkPr && isForbidden(error)) {
                core.notice(`Skipping changelog comment on fork PR #${prNumber} (${headRepo}): token cannot ${action} (${error.status}).`);
                return true;
              }
              return false;
            };

            // Check if bot comment already exists
            let comments;
            try {
              ({ data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              }));
            } catch (error) {
              if (softSkipForbidden(error, 'list comments')) return;
              throw error;
            }

            const existingComment = comments.find(c => c.body.includes(marker));
            if (existingComment) {
              core.info('Changelog comment already exists, skipping');
              return;
            }

            // Post the template comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: template,
              });
            } catch (error) {
              if (softSkipForbidden(error, 'create comments')) return;
              throw error;
            }

            core.info(`Posted changelog comment on PR #${prNumber}`);

            // Detect child PR: check if this PR's base branch is another open PR's head branch
            const baseRef = pr.base.ref;

            if (baseRef === 'main' || baseRef === 'prod') {
              return;
            }

            // Look for a parent PR whose head branch matches our base branch
            const { data: candidatePRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${baseRef}`,
            });

            if (candidatePRs.length === 0) {
              return;
            }

            const parentPR = candidatePRs[0];
            core.info(`Detected parent PR #${parentPR.number} for child PR #${prNumber}`);

            // Add admonition to child PR's changelog comment
            const { data: childComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const childChangelogComment = childComments.find(c => c.body.includes(marker));
            if (childChangelogComment && !childChangelogComment.body.includes(mergedMarker)) {
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: childChangelogComment.id,
                  body: `${mergedMarker}\n> [!NOTE]\n> This changelog has been merged into the changelog for #${parentPR.number}\n\n${childChangelogComment.body}`,
                });
              } catch (error) {
                if (softSkipForbidden(error, 'update comments')) return;
                throw error;
              }
            }
