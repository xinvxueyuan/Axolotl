<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod dependency graph demo</title>
<style>
:root { color-scheme: dark; font: 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; --bg:#111318; --panel:#1a1d24; --panel-2:#222631; --border:#363c49; --text:#f1f3f6; --muted:#9da5b3; --brand:#8bd450; --orange:#f2a65a; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); }
.shell { width:min(1180px, calc(100vw - 24px)); margin:12px auto; display:grid; grid-template-rows:auto auto minmax(560px, 1fr); gap:10px; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border:1px solid var(--border); background:var(--panel); border-radius:10px; }
.title { display:flex; align-items:center; gap:10px; min-width:0; }
.title h1 { margin:0; font-size:16px; }
.title small { display:block; color:var(--muted); }
.actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; }
button { border:1px solid var(--border); color:var(--text); background:var(--panel-2); padding:7px 10px; border-radius:7px; cursor:pointer; }
button:hover, button[data-active="true"] { border-color:var(--brand); color:var(--brand); }
button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.workspace { display:grid; grid-template-columns:minmax(0, 1fr) 260px; min-height:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--panel); }
.viewport { position:relative; min-width:0; min-height:0; overflow:hidden; touch-action:none; background-color:#151820; background-image:linear-gradient(#262b35 1px, transparent 1px),linear-gradient(90deg,#262b35 1px,transparent 1px); background-size:24px 24px; }
canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.nodes { position:absolute; inset:0; transform-origin:0 0; }
.node { position:absolute; width:190px; height:64px; padding:9px 10px; display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-left:3px solid var(--brand); border-radius:9px; background:#20242d; box-shadow:0 8px 18px #0005; cursor:grab; user-select:none; transition:opacity .15s, border-color .15s, box-shadow .15s; }
.node:active { cursor:grabbing; }
.node.selected { border-color:var(--brand); box-shadow:0 0 0 2px #8bd45055, 0 10px 22px #0007; z-index:2; }
.node.dim { opacity:.2; }
.node img { width:34px; height:34px; border-radius:7px; background:#2c313c; object-fit:cover; flex:0 0 auto; }
.node .copy { min-width:0; }
.node strong, .node span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.node strong { font-size:13px; }
.node span { color:var(--muted); font-size:11px; margin-top:2px; }
.controls { position:absolute; z-index:4; top:12px; right:12px; display:flex; gap:4px; padding:4px; border:1px solid var(--border); border-radius:8px; background:#1a1d24dd; }
.controls button { padding:5px 8px; }
.hint { position:absolute; left:12px; bottom:12px; z-index:4; color:var(--muted); padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:#1a1d24dd; font-size:11px; }
.details { padding:16px; border-left:1px solid var(--border); overflow:auto; }
.details h2 { margin:0 0 4px; font-size:15px; }
.details p { margin:0 0 14px; color:var(--muted); font-size:12px; }
.details dl { display:grid; grid-template-columns:1fr auto; gap:7px 12px; margin:0 0 16px; font-size:12px; }
.details dt { color:var(--muted); }
.details dd { margin:0; text-align:right; }
.group { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
.group h3 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:500; }
.group div { padding:4px 0; }
@media (max-width:760px) { .workspace { grid-template-columns:1fr; grid-template-rows:minmax(500px,1fr) auto; } .details { border-left:0; border-top:1px solid var(--border); max-height:180px; } .shell { width:calc(100vw - 12px); margin:6px auto; } }
</style>
</head>
<body>
<main class="shell">
  <header class="bar">
    <div class="title"><div><h1>Mod dependency relationships</h1><small>Stable relationship clusters · 20 nodes · 27 relationships</small></div></div>
    <div class="actions"><button id="mode" data-active="true">Relationship clusters</button><button id="layered">Layered layout</button></div>
  </header>
  <div class="bar"><div class="actions"><button id="fit">Fit view</button><button id="minus">−</button><button id="plus">+</button><span id="zoom" style="padding:7px 4px;color:var(--muted)">100%</span></div><small style="color:var(--muted)">Arrows point from dependent content to the content it uses.</small></div>
  <section class="workspace">
    <div id="viewport" class="viewport" aria-label="Interactive dependency graph" role="application"><canvas id="edges"></canvas><div id="nodes" class="nodes"></div><div class="controls"><button id="reset" aria-label="Reset layout">↺</button></div><div class="hint">Drag cards to arrange · drag background to pan · scroll to zoom</div></div>
    <aside id="details" class="details"><h2>Select a Mod</h2><p>Click a node to inspect its direct relationships.</p></aside>
  </section>
</main>
<script>
const mods = [
  ['fabric','Fabric Loader','loader','https://cdn.jsdelivr.net/gh/PrismLauncher/PrismLauncher@develop/launcher/resources/icons/modrinth.svg'],
  ['api','Fabric API','library'], ['cloth','Cloth Config','library'], ['rei','Roughly Enough Items','mod'], ['sodium','Sodium','mod'], ['lithium','Lithium','mod'], ['indium','Indium','mod'], ['iris','Iris Shaders','mod'], ['modmenu','Mod Menu','mod'], ['ferrite','FerriteCore','mod'], ['starlight','Starlight','mod'], ['xaero','Xaero Maps','mod'], ['journey','JourneyMap','mod'], ['voice','Simple Voice Chat','mod'], ['architectury','Architectury API','library'], ['create','Create','mod'], ['jei','Just Enough Items','mod'], ['spark','spark','mod'], ['moonlight','Moonlight Lib','library'], ['farmers','Farmer’s Delight','mod']
];
const links = [['api','fabric'],['cloth','fabric'],['rei','api'],['sodium','fabric'],['lithium','fabric'],['indium','sodium'],['indium','fabric'],['iris','sodium'],['iris','fabric'],['modmenu','fabric'],['ferrite','fabric'],['starlight','fabric'],['xaero','fabric'],['journey','fabric'],['voice','fabric'],['voice','api'],['create','fabric'],['create','architectury'],['architectury','fabric'],['jei','fabric'],['spark','fabric'],['moonlight','fabric'],['farmers','fabric'],['farmers','moonlight'],['rei','cloth'],['create','moonlight'],['journey','cloth']];
const byId = new Map(mods.map(([id,title,type,icon]) => [id,{id,title,type,icon}]))
const nodes = mods.map(([id,title,type,icon]) => ({id,title,type,icon,x:0,y:0,pinned:false}));
const edges = links.map(([source,target]) => ({source,target}));
const nodeMap = new Map(nodes.map(n=>[n.id,n])); const viewport=document.querySelector('#viewport'); const canvas=document.querySelector('#edges'); const ctx=canvas.getContext('2d'); const nodeLayer=document.querySelector('#nodes');
let selected=null, zoom=1, pan={x:0,y:0}, mode='clusters', dragging=null, last={x:0,y:0};
const W=190,H=64, colors={line:'#697384',active:'#8bd450',missing:'#f2a65a'};
function resize(){const r=viewport.getBoundingClientRect(),d=devicePixelRatio||1; canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw();}
function degree(id){return edges.filter(e=>e.source===id||e.target===id).length}
function renderNodes(){nodeLayer.replaceChildren(); for(const n of nodes){const el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'')+(selected&&selected!==n.id&&!edges.some(e=>(e.source===selected&&e.target===n.id)||(e.target===selected&&e.source===n.id))?' dim':'');el.dataset.id=n.id;el.style.transform=`translate(${n.x}px,${n.y}px)`;el.innerHTML=`<img alt="" src="${n.icon||'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'34\' height=\'34\'><rect width=\'34\' height=\'34\' rx=\'7\' fill=\'%23313947\'/></svg>'}"><div class="copy"><strong>${n.title}</strong><span>${n.type} · v${n.id==='fabric'?'0.16.9':'1.21.1'} · ${degree(n.id)} relations</span></div>`;el.addEventListener('pointerdown',e=>startNode(e,n));el.addEventListener('click',e=>{e.stopPropagation();selected=n.id;renderNodes();renderDetails()});nodeLayer.append(el)}}
function draw(){const r=viewport.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(pan.x,pan.y);ctx.scale(zoom,zoom);for(const e of edges){const a=nodeMap.get(e.source),b=nodeMap.get(e.target);if(!a||!b)continue;const active=!selected||e.source===selected||e.target===selected;ctx.globalAlpha=active?1:.15;ctx.strokeStyle=active?colors.active:colors.line;ctx.lineWidth=active?2:1;const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,curve=Math.max(45,Math.abs(x2-x1)*.38);ctx.beginPath();ctx.moveTo(x1,y1);ctx.bezierCurveTo(x1+curve,y1,x2-curve,y2,x2,y2);ctx.stroke();const t=.94,px=(1-t)**3*x1+3*(1-t)**2*t*(x1+curve)+3*(1-t)*t*t*(x2-curve)+t**3*x2,py=(1-t)**3*y1+3*(1-t)**2*t*y1+3*(1-t)*t*t*y2+t**3*y2;ctx.fillStyle=active?colors.active:colors.line;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-8,py-5);ctx.lineTo(px-8,py+5);ctx.closePath();ctx.fill()}ctx.restore();ctx.globalAlpha=1}
function startNode(e,n){e.stopPropagation();dragging=n; n.pinned=true;last={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)}
viewport.addEventListener('pointermove',e=>{if(dragging){dragging.x+=(e.clientX-last.x)/zoom;dragging.y+=(e.clientY-last.y)/zoom;last={x:e.clientX,y:e.clientY};renderNodes();draw()}});viewport.addEventListener('pointerup',()=>dragging=null);viewport.addEventListener('pointercancel',()=>dragging=null);
viewport.addEventListener('pointerdown',e=>{if(e.target!==viewport)return;dragging={pan:true};last={x:e.clientX,y:e.clientY}});viewport.addEventListener('pointermove',e=>{if(dragging?.pan){pan.x+=e.clientX-last.x;pan.y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};nodeLayer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;draw()}});viewport.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(1.8,zoom*(e.deltaY>0?.9:1.1)));document.querySelector('#zoom').textContent=Math.round(zoom*100)+'%';nodeLayer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;draw()},{passive:false});
function layout(layered=false){
  const adjacency=new Map(nodes.map(n=>[n.id,new Set()]));
  for(const e of edges){adjacency.get(e.source).add(e.target);adjacency.get(e.target).add(e.source)}
  const hub=nodes.slice().sort((a,b)=>(adjacency.get(b.id).size-adjacency.get(a.id).size)||a.title.localeCompare(b.title))[0];
  const distance=new Map([[hub.id,0]]), queue=[hub.id];
  for(let i=0;i<queue.length;i++){for(const next of adjacency.get(queue[i])){if(distance.has(next))continue;distance.set(next,distance.get(queue[i])+1);queue.push(next)}}
  const columns=new Map(); for(const n of nodes){const d=distance.get(n.id)||0;if(!columns.has(d))columns.set(d,[]);columns.get(d).push(n)}
  let columnX=0; const maxRows=5;
  for(const column of [...columns.entries()].sort((a,b)=>a[0]-b[0]).map(x=>x[1])){
    column.sort((a,b)=>a.title.localeCompare(b.title));
    const count=Math.max(1,Math.ceil(column.length/maxRows));
    column.forEach((n,i)=>{n.x=columnX+Math.floor(i/maxRows)*(W+18);n.y=(i%maxRows)*82;n.pinned=false});
    columnX+=count*(W+18)+70;
  }
  if(layered){nodes.forEach((n,i)=>{n.x=100+(i%4)*240;n.y=80+Math.floor(i/4)*105;n.pinned=false})}
  renderNodes();draw();
}
function fit(){const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);const minX=Math.min(...xs),maxX=Math.max(...xs)+W,minY=Math.min(...ys),maxY=Math.max(...ys)+H,r=viewport.getBoundingClientRect();zoom=Math.min(1.35,(r.width-50)/(maxX-minX),(r.height-50)/(maxY-minY));pan={x:(r.width-(maxX-minX)*zoom)/2-minX*zoom,y:(r.height-(maxY-minY)*zoom)/2-minY*zoom};nodeLayer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;document.querySelector('#zoom').textContent=Math.round(zoom*100)+'%';draw()}
function renderDetails(){const d=document.querySelector('#details');const n=nodeMap.get(selected);if(!n){d.innerHTML='<h2>Select a Mod</h2><p>Click a node to inspect its direct relationships.</p>';return}const requires=edges.filter(e=>e.source===n.id).map(e=>nodeMap.get(e.target).title),requiredBy=edges.filter(e=>e.target===n.id).map(e=>nodeMap.get(e.source).title);d.innerHTML=`<h2>${n.title}</h2><p>${n.type} · v1.21.1</p><dl><dt>Relationships</dt><dd>${degree(n.id)}</dd><dt>Layout state</dt><dd>${n.pinned?'Pinned by you':'Stable'}</dd></dl><div class="group"><h3>Uses</h3>${requires.map(x=>`<div>${x}</div>`).join('')||'<div>None</div>'}</div><div class="group"><h3>Used by</h3>${requiredBy.map(x=>`<div>${x}</div>`).join('')||'<div>None</div>'}</div>`}
document.querySelector('#fit').onclick=fit;document.querySelector('#reset').onclick=()=>{selected=null;pan={x:0,y:0};layout(mode==='layered');fit();renderDetails()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.45,zoom-.1);document.querySelector('#zoom').textContent=Math.round(zoom*100)+'%';nodeLayer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;draw()};document.querySelector('#plus').onclick=()=>{zoom=Math.min(1.8,zoom+.1);document.querySelector('#zoom').textContent=Math.round(zoom*100)+'%';nodeLayer.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;draw()};document.querySelector('#mode').onclick=()=>{mode='clusters';document.querySelector('#mode').dataset.active='true';document.querySelector('#layered').dataset.active='false';layout(false);fit()};document.querySelector('#layered').onclick=()=>{mode='layered';document.querySelector('#layered').dataset.active='true';document.querySelector('#mode').dataset.active='false';layout(true);fit()};window.addEventListener('resize',resize);resize();layout(false);fit();renderDetails();
</script>
</body>
</html>
